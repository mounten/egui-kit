[package]
name = "egui-kit-example"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui-kit = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_urlencoded = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }
